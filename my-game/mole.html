<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 잡기 · 호성 오락실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'%3E%3Cpath fill='%23f3efe4' d='M3 0h4v1h1v1h1v2h1v5h-1v2h-2v1h-4v-1h-2v-2h-1v-5h1v-2h1v-1h1z'/%3E%3Cpath fill='%23151515' d='M2 5h1v1h-1zM7 5h1v1h-1zM4 6h2v1h-2z'/%3E%3Cpath fill='%23e07a6f' d='M1 6h1v1h-1zM8 6h1v1h-1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --room: #171a2e;
    --room-2: #22264a;
    --ink: #1d2236;
    --paper: #f1f2f7;
    --dim: #a9aecb;
    --screen: #0d1020;
    --btn: #ffcf3f;
    --btn-deep: #c99a12;
    --ion-sky: #5cc8f5;
    --ion-ice: #e8f6ff;
    --ion-fizz: #9ee8ff;
    --ion-lime: #c6f04a;     /* 점수·신기록 */
    --warn: #ff5a6e;         /* 남은 시간이 적을 때만 잠깐 */
    /* 게임기 몸통 색: 두더지 잡기는 토끼(.bunny). 연분홍 몸통 + 토끼 귀 + 진한 베리색 테두리 */
    --c: #ffc8d8;
    --c-deep: #ff8fa3;
    --c-ink: #5b2340;
    --pixel: "Galmuri11", monospace;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background-color: #85cff6;   /* 하늘 (아래 .scene이 도트 풍경을 그린다) */
    color: var(--paper);
    font-family: var(--sans);
    line-height: 1.7;
    word-break: keep-all;
    overflow-x: hidden;
  }
  ::selection { background: var(--c-deep); color: #fff; }
  :focus-visible { outline: 2px dashed var(--btn); outline-offset: 4px; }
  svg { display: block; }
  [hidden] { display: none !important; }

  .top { max-width: 960px; margin: 0 auto; padding: 24px 16px 0; }
  .back {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--pixel);
    font-size: 12px;
    text-decoration: none;
    box-shadow: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink),
                0 6px 12px -4px rgba(0,0,0,.4);
    transition: transform .08s;
  }
  .back:hover { background: var(--btn); }
  .back:active { transform: translateY(3px); }

  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; text-align: center; }
  .sub { color: var(--c-ink); font-weight: 600; }

  /* ---------- 바깥 풍경: 헤네시스 같은 낮 하늘 + 언덕 + 울타리 + 잔디밭 (화면에 고정) ---------- */
  .scene {
    position: fixed; inset: 0; z-index: -1;
    overflow: hidden;
    pointer-events: none;
    /* 도트 느낌이 나도록 부드러운 그라데이션 대신 색 띠를 끊어서 칠한다 */
    background: linear-gradient(to bottom,
      #5ab8f0 0 18%, #6ec3f4 18% 34%, #85cff6 34% 50%, #a2dbf8 50% 64%, #c2e8fb 64% 76%, #e2f5fe 76%);
  }
  .scene > * { position: absolute; left: 0; right: 0; image-rendering: pixelated; }
  .cloud { right: auto; left: var(--x); top: var(--y); animation: drift var(--t) steps(var(--steps), end) infinite; animation-delay: var(--d); }
  .cloud svg { width: auto; height: auto; }
  @keyframes drift {
    from { translate: calc(-1 * var(--x) - 30vw) 0; }
    to   { translate: calc(105vw - var(--x)) 0; }
  }
  .hills-far  { bottom: 150px; height: 120px; background-repeat: repeat-x; background-position: 0 100%; }
  .hills-near { bottom: 110px; height: 96px;  background-repeat: repeat-x; background-position: 37px 100%; }
  .fence      { bottom: 96px;  height: 50px;  background-repeat: repeat-x; background-position: 0 100%; }
  .ground { bottom: 0; height: 112px; }
  /* 잔디밭 구멍에서 머리만 빼꼼 내민 친구들. 가끔 쏙 숨었다가 다시 나온다 */
  .peek { left: auto; right: auto; display: flex; flex-direction: column; align-items: center; }
  .peek .pb { position: relative; z-index: 1; overflow: hidden; width: 56px; margin-bottom: -12px; }
  .peek .pc { position: absolute; left: 0; top: 0; animation: duck 4s steps(1, end) infinite; animation-delay: var(--d); }
  @keyframes duck { 0%, 72% { transform: translateY(0); } 76% { transform: translateY(45%); } 84% { transform: translateY(100%); } 92% { transform: translateY(30%); } 96%, 100% { transform: translateY(0); } }

  /* ---------- 게임기 ---------- */
  .cabinet {
    position: relative;
    margin: 96px auto 0;   /* 토끼 귀가 들어갈 자리 */
    max-width: 640px;
    background: var(--c);
    padding: 24px 24px 28px;
    border-radius: 24px 24px 12px 12px;
    box-shadow: 0 30px 50px -20px rgba(91, 35, 64, .55);
  }
  .fizz { position: absolute; inset: 0; pointer-events: none; }
  /* 몸통에 붙은 흰 솜털 점 장식 */
  .fizz i {
    position: absolute;
    border: 2px solid #ff8fa3;
    border-radius: 50%;
    background: #fff;
    animation: rise 2.4s steps(4, end) infinite;
  }
  @keyframes rise { 50% { transform: translateY(-4px); } }
  /* 게임기 위로 솟은 토끼 귀 (가끔 쫑긋) */
  .ear { position: absolute; top: -84px; z-index: -1; transform-origin: 50% 100%; }
  .ear.l { left: 18%; rotate: -10deg; animation: twitchL 3.2s steps(1, end) infinite; }
  .ear.r { right: 18%; rotate: 10deg; animation: twitchR 3.2s steps(1, end) infinite -1.6s; }
  @keyframes twitchL { 0%, 88% { rotate: -10deg; } 92% { rotate: -18deg; } 96% { rotate: -10deg; } }
  @keyframes twitchR { 0%, 88% { rotate: 10deg; } 92% { rotate: 18deg; } 96% { rotate: 10deg; } }

  .marquee {
    position: relative;
    display: inline-block;
    padding: 10px 40px;
    background: #fff;
    border-radius: 999px;
    font-family: var(--pixel);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.2;
    color: var(--c-ink);
    /* 스티커 알약: 두꺼운 베리색 테두리 + 아래로 두툼한 두께 */
    box-shadow: 0 0 0 4px var(--c-ink), 0 10px 0 4px var(--c-ink);
  }

  /* ---------- 화면 ---------- */
  .bezel { margin-top: 28px; background: var(--c-ink); padding: 12px; border-radius: 10px; }
  /* 콤보 5·10 이상에서 빠르게 잡을 때마다 화면이 짧게 흔들린다 (0.2초, 3px/6px라 조준은 방해하지 않음) */
  .bezel.shake { animation: shake .2s steps(4, end); }
  @keyframes shake {
    0%   { translate: var(--amp) 0; }
    25%  { translate: calc(var(--amp) * -1) calc(var(--amp) * .5); }
    50%  { translate: calc(var(--amp) * .6) calc(var(--amp) * -.6); }
    75%  { translate: calc(var(--amp) * -.4) 0; }
    100% { translate: 0 0; }
  }
  .screen {
    position: relative;
    padding: 14px 16px 18px;
    background: var(--screen);
    border-radius: 4px;
    overflow: hidden;
  }
  /* 점수판: 베리색 간판(테두리보다 한 톤 밝게). 결 도트는 JS가 깐다 */
  .screen { background-color: #7a2e55; background-size: 64px 32px; image-rendering: pixelated; }
  .hud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--pixel); font-size: 12px; color: #ffd9e4; }
  .hud b { font-weight: 400; color: #fff; font-variant-numeric: tabular-nums; }
  .hud .score b { font-size: 24px; color: var(--btn); }
  .hud .time b { font-size: 24px; }
  .hud .time.low b { color: #ffb0b6; }   /* 경고 빨강을 나무 위에서도 읽히게 밝힌 색 */
  .hud .best b { color: var(--btn); }

  /* 30초 타이머 막대: 도트 칸 30개 (남은 시간 = 잔디색) */
  .timebar {
    display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px;
    margin-top: 10px; padding: 3px;
    background: #3d1529;
  }
  .timebar i { height: 8px; background: #86d065; }
  .timebar i.gone { background: transparent; }
  .timebar.low i:not(.gone) { background: var(--warn); }

  /* ---------- 구멍 3×3 ---------- */
  /* 잔디밭: 화면 아래쪽을 가장자리까지 꽉 채운다. 무늬는 JS가 도트 타일로 깐다 */
  .lawn {
    margin: 14px -16px -18px;
    padding: 14px 16px 18px;
    background-color: #5bb04a;
    background-size: 96px 96px;
    image-rendering: pixelated;
  }
  .field {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px 18px;
    max-width: 480px;
    margin: 0 auto;
  }
  .hole {
    position: relative;
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* 두더지는 구멍 가운데 선 아래로 숨어 있다가 .up이면 올라오고, .down이면 쏙 들어간다.
     위쪽에 여유 공간을 둬서 튀어 오를 때 머리가 잘리지 않게 한다. */
  .burrow {
    position: relative; z-index: 1;
    display: block;
    width: 72%;
    aspect-ratio: 14 / 18;   /* 귀가 긴 토끼까지 들어가는 높이 */
    margin: 0 auto -16%;
    overflow: hidden;
  }
  .mole {
    position: absolute; left: 0; right: 0; bottom: 0;
    transform: translateY(100%);
    transform-origin: 50% 100%;
  }
  .mole svg, .pit svg { width: 100%; height: auto; }

  /* 올라오기: 쑥 튀어나와 늘어났다가 → 찌그러지며 착지 → 제자리. 1초 동안 좌우로 두리번 */
  .hole.up .mole {
    transform: translateY(0);
    animation: pop .4s forwards, look .5s steps(1, end) .4s infinite;
  }
  @keyframes pop {
    0%   { transform: translateY(100%) scale(.9, 1.1); animation-timing-function: steps(3, end); }
    45%  { transform: translateY(-12%) scale(.88, 1.14); animation-timing-function: steps(2, end); }
    70%  { transform: translateY(3%) scale(1.12, .88); animation-timing-function: steps(2, end); }
    85%  { transform: translateY(-2%) scale(.97, 1.03); animation-timing-function: steps(1, end); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes look { 0% { rotate: -4deg; } 50% { rotate: 4deg; } }

  /* 들어가기: 살짝 움찔(위로 들썩) 했다가 홀쭉해지며 빠르게 쏙 */
  .hole.down .mole { animation: dive .28s forwards; }
  @keyframes dive {
    0%   { transform: translateY(0) scale(1, 1); animation-timing-function: steps(1, end); }
    25%  { transform: translateY(-6%) scale(1.06, .94); animation-timing-function: steps(3, end); }
    100% { transform: translateY(100%) scale(.86, 1.12); }
  }

  /* 올라올 때 구멍에서 튀는 흙 도트 */
  /* 구멍 테두리(두더지 양옆)에서 시작해 바깥쪽으로 튀어서, 두더지 몸에 가려지지 않게 한다.
     거리는 구멍 폭 기준(cqw)이라 휴대폰에서도 같은 비율로 튄다. */
  .hole { container-type: inline-size; }
  .dust { position: absolute; left: 50%; bottom: 24%; z-index: 2; pointer-events: none; }
  .dust i {
    position: absolute; left: 0; top: 0;
    width: 8px; height: 8px;
    background: #c99a6b;
    box-shadow: 0 0 0 2px #1d2236;
    opacity: 0;
  }
  .dust i:nth-child(3n) { background: #e3c29b; width: 6px; height: 6px; }
  .dust i:nth-child(3n+2) { background: #a8754e; }
  .hole.up .dust i { animation: dust .6s steps(6, end) forwards; }
  /* --sx 시작 위치, --dx·--dy 날아가는 방향 */
  .dust i:nth-child(1) { --sx: -34cqw; --dx: -20cqw; --dy: -30cqw; }
  .dust i:nth-child(2) { --sx: -30cqw; --dx: -14cqw; --dy: -44cqw; }
  .dust i:nth-child(3) { --sx: -38cqw; --dx: -24cqw; --dy: -16cqw; }
  .dust i:nth-child(4) { --sx: 30cqw;  --dx: 20cqw;  --dy: -34cqw; }
  .dust i:nth-child(5) { --sx: 34cqw;  --dx: 12cqw;  --dy: -46cqw; }
  .dust i:nth-child(6) { --sx: 36cqw;  --dx: 24cqw;  --dy: -18cqw; }
  /* 위로 튀었다가 포물선을 그리며 떨어진다 */
  @keyframes dust {
    0%   { opacity: 1; transform: translate(var(--sx), 0); }
    45%  { opacity: 1; transform: translate(calc(var(--sx) + var(--dx) * .6), var(--dy)); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(var(--sx) + var(--dx)), calc(var(--dy) * .1)); }
  }
  /* ---------- 잡혔을 때: 납작하게 찌그러지며 바로 쏙 + 노란 타격 별 ---------- */
  .hole.hit .mole { animation: whacked .22s forwards; }
  @keyframes whacked {
    0%   { transform: translateY(0) scale(1.18, .72); animation-timing-function: steps(1, end); }
    35%  { transform: translateY(8%) scale(1.22, .6); animation-timing-function: steps(2, end); }
    100% { transform: translateY(100%) scale(.9, .5); }
  }
  /* --bx/--by: 망치로 누른 자리(구멍 기준). 키보드로 잡으면 두더지 얼굴 쯤 */
  .burst {
    position: absolute; left: var(--bx, 50%); top: var(--by, 30%); z-index: 3;
    width: 64cqw;
    translate: calc(-50% - 18cqw) calc(-50% + 16cqw);   /* 망치 머리와 겹치게, 누른 자리의 살짝 왼쪽 아래에서 (JS의 BURST_SHIFT와 같은 값) */
    pointer-events: none;
    opacity: 0;
  }
  .burst svg { width: 100%; height: auto; }
  .hole.hit .burst { animation: burst .3s steps(3, end) forwards; }
  @keyframes burst {
    0%   { opacity: 1; transform: scale(.4) rotate(0deg); }
    60%  { opacity: 1; transform: scale(1.1) rotate(12deg); }
    100% { opacity: 0; transform: scale(1.25) rotate(18deg); }
  }

  /* ---------- 구멍 위에 뜨는 글자: 칭찬·점수·"텅~" ---------- */
  .float {
    position: absolute; left: 50%; top: -26cqw; z-index: 4;   /* 타격 별 위쪽, 두더지 머리 위 */
    translate: -50% 0;
    display: flex; flex-direction: column; align-items: center;
    font-family: var(--pixel);
    line-height: 1.1;
    white-space: nowrap;
    pointer-events: none;
    /* 도트 외곽선: 번지지 않는 1칸 그림자 4방향 */
    font-weight: 700;   /* Galmuri11 굵은 글꼴 */
    /* 두꺼운 3px 짙은 베리색 외곽선(8방향) + 아래 두께. 잔디 위에서도 글자가 섞이지 않게 */
    --ol: #3a0f26;
    text-shadow:
      3px 0 0 var(--ol), -3px 0 0 var(--ol), 0 3px 0 var(--ol), 0 -3px 0 var(--ol),
      3px 3px 0 var(--ol), -3px 3px 0 var(--ol), 3px -3px 0 var(--ol), -3px -3px 0 var(--ol),
      0 6px 0 var(--ol);
    animation: floatUp .7s steps(7, end) forwards;
  }
  /* 잔디(초록)와 겹치지 않는 진하고 채도 높은 색: 칭찬은 초록의 반대색인 핫핑크 */
  .float .praise { font-size: 24px; color: #ff2e88; }
  .float .pts { font-size: 16px; color: #ffe600; }
  .float.slow .pts { font-size: 24px; }
  .float .late { font-size: 12px; color: #00b4ff; }
  .float.bad .warn { font-size: 16px; color: #ff2a4a; }
  .float.bad .pts { font-size: 24px; color: #ff2a4a; }
  .float.gold .praise { color: #ffc400; }
  .float.gold .pts { color: #fff; }

  /* 황금 두더지: 머리 주변에서 반짝이는 도트 별 */
  .sparkle { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none; }
  .hole.up.is-gold .sparkle { display: block; }
  .sparkle i {
    position: absolute; width: 14cqw; aspect-ratio: 1;
    background:
      linear-gradient(#fff, #fff) center / 34% 100% no-repeat,
      linear-gradient(#fff, #fff) center / 100% 34% no-repeat;
    animation: twinkle .4s steps(1, end) infinite;
  }
  .sparkle i:nth-child(1) { left: 10%; top: 8%; }
  .sparkle i:nth-child(2) { right: 8%; top: 22%; animation-delay: -.2s; }
  .sparkle i:nth-child(3) { left: 22%; top: 40%; width: 9cqw; animation-delay: -.1s; }
  @keyframes twinkle { 50% { opacity: 0; } }

  /* 게임기 아래 범례: 누가 몇 점인지 */
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin-top: 16px; font-family: var(--pixel); font-size: 12px; color: var(--c-ink); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { font-weight: 400; }
  .legend .minus b { color: #6e0716; }
  .float.empty { top: 30%; font-size: 16px; color: #fff; animation-duration: .55s; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(10px) scale(.7); }
    20%  { opacity: 1; transform: translateY(0) scale(1.1); }
    35%  { transform: translateY(-4px) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-26px); }
  }

  /* ---------- 콤보 말풍선: 방금 잡은(또는 놓친) 구멍 옆에 뜬다 ---------- */
  .lawn { position: relative; isolation: isolate; }
  /* 칭찬 문구는 구멍 위, 말풍선은 두더지 옆(얼굴 높이)이라 서로 겹치지 않는다.
     오른쪽 줄 구멍은 왼쪽에, 나머지는 오른쪽에 띄워 화면 밖으로 나가지 않게 한다 */
  .cbubble {
    position: absolute; top: 30%; z-index: 5;
    pointer-events: none;
    animation: bubbleLife .95s steps(10, end) forwards;
  }
  .cbubble.side-r { left: 84%; transform-origin: 0 50%; }
  .cbubble.side-l { right: 84%; transform-origin: 100% 50%; }
  @keyframes bubbleLife {
    0%   { opacity: 0; transform: scale(.4); }
    15%  { opacity: 1; transform: scale(1.15); }
    25%  { transform: scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-8px); }
  }
  /* 같은 말풍선을 두 겹 겹쳐 두고, 콤보가 깨질 때만 지그재그 금을 따라 두 조각으로 자른다 */
  .cbubble .half {
    --bb: #fff;
    position: relative;
    display: flex; align-items: baseline; gap: 4px;
    padding: 5px 12px 6px;
    background: var(--bb);
    border: 3px solid var(--c-ink);
    border-radius: 14px;
    box-shadow: 0 4px 0 var(--c-ink);
    font-family: var(--pixel); font-weight: 700; font-size: 16px; line-height: 1;
    color: var(--c-ink);
    white-space: nowrap;
  }
  .cbubble .half b { font-weight: 700; font-size: 28px; color: #ff2e88; font-variant-numeric: tabular-nums; }
  /* 말풍선 꼬리: 두더지 쪽을 가리킨다 (테두리색 삼각형 위에 바탕색 삼각형) */
  .cbubble .half::before, .cbubble .half::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; }
  .cbubble .half::before { width: 13px; height: 18px; background: var(--c-ink); }
  .cbubble .half::after { width: 8px; height: 10px; background: var(--bb); }
  .cbubble.side-r .half::before { left: -14px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .cbubble.side-r .half::after { left: -6px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .cbubble.side-l .half::before { right: -14px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .cbubble.side-l .half::after { right: -6px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .cbubble .r { position: absolute; inset: 0; visibility: hidden; }
  /* 콤보가 오를수록 말풍선이 달아오른다: 5부터 노랑, 10부터 주황 */
  .cbubble.t2 .half { --bb: #ffe98a; }
  .cbubble.t3 .half { --bb: #ffb27a; }
  /* 깨짐: 빨개지면서 두 조각으로 갈라져 떨어진다 (꼬리·두께까지 자르도록 바깥으로 넉넉히) */
  .cbubble.break { animation: none; }
  .cbubble.break .half { --bb: var(--warn); color: #fff; }
  .cbubble.break .half b { color: #fff; }
  .cbubble.break .l { clip-path: polygon(-20px -12px, 54% -12px, 46% 30%, 56% 55%, 47% 80%, 52% calc(100% + 12px), -20px calc(100% + 12px)); animation: splitL .6s steps(6, end) forwards; }
  .cbubble.break .r { visibility: visible; clip-path: polygon(54% -12px, calc(100% + 20px) -12px, calc(100% + 20px) calc(100% + 12px), 52% calc(100% + 12px), 47% 80%, 56% 55%, 46% 30%); animation: splitR .6s steps(6, end) forwards; }

  /* ---------- 가속 효과: 속도 단계가 오르면 잔디밭 가장자리가 흐려지고 바깥으로 달리는 선이 생긴다 ----------
     구멍·두더지보다 뒤(잔디 바닥)에만 걸려서 잡을 대상은 계속 또렷하다 */
  .rush {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    /* 가운데는 비우고 가장자리로 갈수록 진하게 */
    -webkit-mask-image: radial-gradient(ellipse 72% 66% at 50% 50%, transparent 50%, #000 100%);
    mask-image: radial-gradient(ellipse 72% 66% at 50% 50%, transparent 50%, #000 100%);
    /* 흐림은 마스크가 걸린 이 요소 자체에 건다 (자식에 걸면 마스크 안쪽만 보여서 잔디가 안 흐려짐) */
    -webkit-backdrop-filter: blur(var(--rb, 0px));
    backdrop-filter: blur(var(--rb, 0px));
  }
  .rush-lines {
    position: absolute; inset: -10%;
    background: center / 100% 100% no-repeat;
    opacity: 0;
    animation: rushOut var(--rs, .45s) linear infinite;
  }
  .rush-lines.b { animation-delay: calc(var(--rs, .45s) / -2); }
  /* 선이 가운데에서 바깥으로 밀려나며 사라진다 → 앞으로 달려 나가는 느낌 */
  @keyframes rushOut {
    from { transform: scale(.9); opacity: var(--rl, 0); }
    to   { transform: scale(1.15); opacity: 0; }
  }
  .lawn.rush-2 .rush { opacity: 1; --rb: 3px; --rl: .4; --rs: .45s; }
  .lawn.rush-3 .rush { opacity: 1; --rb: 6px; --rl: .7; --rs: .26s; background: rgba(58, 15, 38, .2); }

  /* 속도 표시: 잔디밭 왼쪽 위. 콤보 단계만큼 화살표가 켜진다 */
  .tempo {
    position: absolute; left: 10px; top: 10px; z-index: 5;
    display: flex; align-items: center; gap: 3px;
    padding: 4px 10px;
    background: var(--c-ink);
    border-radius: 999px;
    font-family: var(--pixel); font-size: 12px; line-height: 1; color: #ffd9e4;
    pointer-events: none;
  }
  .tempo span { margin-right: 4px; }
  .tempo i { display: block; opacity: .3; }
  .tempo i.on { opacity: 1; }
  .tempo.t3 i.on { animation: blink .3s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: .5; } }

  /* 단계가 오를 때 잔디밭 가운데에 크게 뜨는 문구 */
  .speedup {
    position: absolute; left: 50%; top: 42%; z-index: 6;
    translate: -50% 0;
    font-family: var(--pixel); font-size: 36px; line-height: 1; white-space: nowrap;
    color: var(--btn);
    text-shadow: 3px 0 0 var(--c-ink), -3px 0 0 var(--c-ink), 0 3px 0 var(--c-ink), 0 -3px 0 var(--c-ink), 0 6px 0 var(--c-ink);
    pointer-events: none;
    animation: speedup .9s steps(9, end) forwards;
  }
  @keyframes speedup {
    0%   { opacity: 0; transform: scale(.6); }
    20%  { opacity: 1; transform: scale(1.15); }
    35%  { transform: scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
  }
  @keyframes splitL {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(-6px, -2px) rotate(-6deg); opacity: 1; }
    100% { transform: translate(-22px, 30px) rotate(-22deg); opacity: 0; }
  }
  @keyframes splitR {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(6px, -2px) rotate(6deg); opacity: 1; }
    100% { transform: translate(22px, 30px) rotate(22deg); opacity: 0; }
  }

  .hud .score b { display: inline-block; }
  .hud .score.bump b { animation: scoreBump .2s steps(2, end); }
  @keyframes scoreBump { 50% { transform: scale(1.3); } }
  .pit { position: relative; display: block; }
  .hole:hover .pit svg { filter: brightness(1.25); }
  .hole:focus-visible { outline-offset: 2px; }
  /* 게임 중에는 마우스 포인터가 뿅망치. 누르는 순간엔 내려친 망치로 바뀐다 (그림은 JS가 만든다) */
  .lawn.playing, .lawn.playing .hole { cursor: var(--hammer); }
  .lawn.playing.swing, .lawn.playing.swing .hole { cursor: var(--hammer-swing); }

  /* ---------- 시작·결과 안내판 ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    padding: 16px;
    background: rgba(8, 8, 10, .72);     /* 검은 반투명 막 + 뒤 화면 흐리게 */
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    font-family: var(--pixel);
  }
  .overlay strong { font-weight: 400; font-size: 24px; line-height: 1.3; color: #fff; }
  .overlay p { font-size: 12px; color: var(--dim); }
  .overlay .no-rabbit { font-weight: 400; color: #ffb0b6; }
  .overlay .final { font-size: 48px; line-height: 1.1; color: var(--ion-lime); font-variant-numeric: tabular-nums; }
  .overlay .final b { font-weight: 400; }
  .overlay .final small { font-size: 16px; color: var(--paper); }
  .overlay .over { font-size: 36px; color: var(--warn); text-shadow: 0 4px 0 #1d2236; }   /* 게임 오버에만 따뜻한 색 */
  .result { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .overlay .maxcombo { font-size: 16px; color: var(--paper); }
  .overlay .maxcombo b { font-weight: 400; color: var(--ion-lime); font-variant-numeric: tabular-nums; }
  .overlay .acc { font-size: 16px; color: var(--paper); }
  .overlay .acc b { font-weight: 400; color: var(--ion-lime); font-variant-numeric: tabular-nums; }
  .overlay .acc small { font-size: 12px; color: #ffd9e4; }
  .overlay .endline { min-height: 1.4em; color: var(--ion-fizz); }
  .overlay .endline.record { color: var(--ion-lime); }
  .overlay .egg { margin-bottom: 4px; }

  /* 노란 둥근 버튼 (오락실 공통 .push) */
  .push {
    margin-top: 8px;
    padding: 12px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--c-ink);
    font-family: var(--pixel);
    font-size: 16px;
    cursor: pointer;
    box-shadow: inset 0 0 0 3px #ffdd6e, 0 6px 0 var(--btn-deep), 0 12px 12px -6px rgba(0,0,0,.4);
    touch-action: manipulation;
    transition: transform .06s, box-shadow .06s;
  }
  .push:hover { filter: brightness(1.04); }
  .push:active { transform: translateY(5px); box-shadow: inset 0 0 0 3px #ffdd6e, 0 1px 0 var(--btn-deep), 0 4px 6px -3px rgba(0,0,0,.4); }

  .keys { margin-top: 10px; font-family: var(--pixel); font-size: 12px; color: var(--c-ink); }

  @media (max-width: 600px) {
    .cabinet { padding: 18px 12px 22px; }
    .marquee { font-size: 24px; padding: 8px 24px; }
    .bezel { margin-top: 22px; padding: 8px; }
    .screen { padding: 12px 10px 16px; }
    .hud .score b, .hud .time b { font-size: 16px; }
    .lawn { margin: 12px -10px -16px; padding: 10px 10px 16px; background-size: 72px 72px; }
    .field { gap: 6px 10px; }
    .float { top: -40cqw; }
    .float .praise, .float.slow .pts { font-size: 16px; }
    .float .pts { font-size: 12px; }
    .cbubble .half { font-size: 12px; padding: 3px 8px 4px; }
    .speedup { font-size: 24px; }
    .cbubble .half b { font-size: 20px; }
    .overlay .final { font-size: 36px; }
    .overlay .over { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="arcade.html"><span data-back></span>게임 목록</a>
</header>

<main>
  <p class="sub">구멍에서 쏙 나온 두더지를 30초 동안 최대한 많이 잡아 보세요.</p>

  <section class="cabinet" aria-label="두더지 잡기 게임기">
    <div class="fizz" aria-hidden="true">
      <span class="ear l" data-ear></span><span class="ear r" data-ear></span>
      <i style="left:18px;top:30px;width:12px;height:12px"></i>
      <i style="left:38px;top:58px;width:8px;height:8px;animation-delay:-.6s"></i>
      <i style="right:22px;top:40px;width:10px;height:10px;animation-delay:-1.2s"></i>
      <i style="right:44px;top:22px;width:6px;height:6px;animation-delay:-1.8s"></i>
    </div>

    <h1 class="marquee">두더지 잡기!</h1>

    <div class="bezel">
      <div class="screen">
        <div class="hud">
          <span class="score">점수 <b id="score">0</b></span>
          <span class="acc">정확도 <b id="acc">-</b></span>
          <span class="time" id="timeBox">남은 시간 <b id="time">30</b>초</span>
          <span class="best">최고 <b id="best">0</b></span>
        </div>
        <div class="timebar" id="timebar" aria-hidden="true"></div>

        <div class="lawn" id="lawn">
          <div class="tempo" id="tempo" aria-hidden="true"><span>속도</span><i></i><i></i><i></i></div>
          <div class="rush" aria-hidden="true"><span class="rush-lines a"></span><span class="rush-lines b"></span></div>
          <div class="field" id="field"></div>
        </div>

        <!-- 시작 안내판 -->
        <div class="overlay" id="startPanel">
          <span class="egg" data-egg></span>
          <strong>두더지를 잡아라!</strong>
          <p>두더지를 누르면 1점, 재빨리 누르면 보너스 + 콤보!<br>황금 두더지는 +5점, <b class="no-rabbit">토끼를 잡으면 -5점 + 콤보 깨짐!</b></p>
          <button type="button" class="push" id="startBtn">시작</button>
        </div>

        <!-- 결과 안내판: 시간이 끝나면 보여 준다 -->
        <div class="overlay" id="endPanel" hidden>
          <strong class="over">Game Over!</strong>
          <div class="result" aria-live="polite">
            <p>최종 점수</p>
            <span class="final"><b id="finalScore">0</b><small>점</small></span>
            <p class="maxcombo">최대 콤보 <b id="maxCombo">0</b>회</p>
            <p class="acc">정확도 <b id="finalAcc">-</b> <small id="finalAccDetail"></small></p>
          </div>
          <p class="endline" id="endLine"></p>
          <button type="button" class="push" id="againBtn">다시 하기</button>
        </div>
      </div>
    </div>
    <div class="legend" aria-label="점수 안내">
      <span><i data-icon="mole"></i>두더지 <b>+1</b></span>
      <span><i data-icon="gold"></i>황금 두더지 <b>+5</b></span>
      <span class="minus"><i data-icon="rabbit"></i>토끼 <b>-5 · 콤보 깨짐</b></span>
    </div>
    <p class="keys">마우스로 클릭하거나 화면을 터치해서 잡아요</p>
  </section>
</main>

<script>
  // ---------- 도트 그리기 (arcade.html·rps.html과 같은 방식) ----------
  function pix(map, pal, px, outline) {
    const h = map.length, w = map[0].length, o = outline ? 1 : 0;
    const on = (x, y) => y >= 0 && y < h && x >= 0 && x < w && map[y][x] !== '.';
    const rect = (x, y, f) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
    let r = '';
    if (outline) {
      for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
        if (!on(x, y) && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) r += rect(x + o, y + o, outline);
      }
    }
    map.forEach((row, y) => [...row].forEach((c, x) => { if (pal[c]) r += rect(x + o, y + o, pal[c]); }));
    const W = w + 2 * o, H = h + 2 * o;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W * px}" height="${H * px}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
  }
  const BACK_ARROW = ['...o', '..oo', '.ooo', 'oooo', '.ooo', '..oo', '...o'];
  document.querySelector('[data-back]').innerHTML = pix(BACK_ARROW, { o: '#1d2236' }, 2);
  const TEMPO_ARROW = ['o...', 'oo..', 'ooo.', 'oooo', 'ooo.', 'oo..', 'o...'];
  document.querySelectorAll('#tempo i').forEach(el => { el.innerHTML = pix(TEMPO_ARROW, { o: '#ffcf3f' }, 2); });

  // ---------- 스프라이트 ----------
  // 두더지: b 털, d 그림자, e 눈, n 코, l 주둥이, t 앞니, c 볼
  const MOLE = [
    '...bbbbbb...',
    '..bbbbbbbd..',
    '.bbbbbbbbbd.',
    '.bbebbbbebd.',
    '.bcbbbbbbcd.',
    'bbbbnnnnbbdd',
    'bbblnnnnlbdd',
    'bbllllllllbd',
    'bbbllttllbdd',
    'bbbbbttbbbdd',
    'bbbbbbbbbddd',
  ];
  const MOLE_COLORS = { b: '#8a5a3c', d: '#5e3a26', e: '#151515', n: '#ff8fa3', l: '#e3c29b', t: '#ffffff', c: '#e07a6f' };
  // 구멍: r 테두리(흙), h 그림자, k 안쪽
  const PIT = [
    '...rrrrrrrr...',
    '.rrkkkkkkkkrr.',
    'rkkkkkkkkkkkkr',
    'rhkkkkkkkkkkhr',
    '.rhhkkkkkkhhr.',
    '...rrrrrrrr...',
  ];
  const PIT_COLORS = { r: '#a8754e', h: '#5e3a26', k: '#2a170d' };
  // 잔디밭 바닥: 24×24 도트 타일을 만들어 반복해서 깐다. g 잔디, d 진한 풀잎, l 밝은 풀잎, f 꽃잎, y 꽃술
  function grassTile() {
    const g = Array.from({ length: 24 }, () => Array(24).fill('g'));
    const tuft = (x, y, c) => { g[y][x + 1] = c; g[y + 1][x] = c; g[y + 1][x + 2] = c; };
    const flower = (x, y) => { g[y][x + 1] = g[y + 1][x] = g[y + 1][x + 2] = g[y + 2][x + 1] = 'f'; g[y + 1][x + 1] = 'y'; };
    [[2, 1, 'd'], [13, 3, 'l'], [19, 8, 'd'], [5, 10, 'l'], [15, 12, 'd'], [10, 17, 'd'], [20, 18, 'l'], [1, 20, 'd'], [8, 6, 'd']]
      .forEach(([x, y, c]) => tuft(x, y, c));
    flower(17, 1); flower(3, 15);
    return g.map(r => r.join(''));
  }
  const GRASS_COLORS = { g: '#5bb04a', d: '#3f8a3a', l: '#86d065', f: '#ffffff', y: '#ffcf3f' };
  // 타격 별: y 노랑 빛살, w 흰 가운데
  const BURST = [
    '.....y.....',
    '.y...y...y.',
    '..y..y..y..',
    '...ywwwy...',
    'yyyywwwyyyy',
    '...ywwwy...',
    '..y..y..y..',
    '.y...y...y.',
    '.....y.....',
  ];
  const BURST_COLORS = { y: '#ffcf3f', w: '#ffffff' };

  // 달걀 (index.html과 같은 고정 디자인)
  const EGG = [
    '...wwww...',
    '..wwwwww..',
    '.wwwwwwws.',
    '.wwwwwwws.',
    'wwwwwwwwws',
    'wwewwwwews',
    'wbwwmmwwbs',
    'wwwwwwwwss',
    'wwwwwwwwss',
    '.wwwwwwss.',
    '..wwwsss..',
    '...ssss...',
  ];
  const EGG_COLORS = { w: '#f3efe4', s: '#c9c0aa', e: '#151515', m: '#151515', b: '#e07a6f' };
  document.querySelector('[data-egg]').innerHTML = pix(EGG, EGG_COLORS, 3, '#1d2236');

  // ---------- 최고 기록 (arcade.html과 같은 store 헬퍼) ----------
  const store = {
    get(k) { try { return Number(localStorage.getItem(k)) || 0; } catch (_) { return 0; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (_) {} },
  };
  const $ = (id) => document.getElementById(id);
  $('best').textContent = store.get('mole-best');

  // ---------- 틀: 구멍 9개 + 타이머 칸 30개 ----------
  const MOLE_SVG = pix(MOLE, MOLE_COLORS, 6, '#1d2236');
  // 황금 두더지: 같은 모양, 금빛 팔레트
  const GOLD_COLORS = { b: '#ffcf3f', d: '#c99a12', e: '#151515', n: '#ff8fa3', l: '#fff1b0', t: '#ffffff', c: '#ff9f6b' };
  const GOLD_SVG = pix(MOLE, GOLD_COLORS, 6, '#5a3a00');
  // 토끼 (잡으면 안 됨): w 흰 털, s 그늘, p 귀 안쪽, e 눈, b 볼, n 코, m 입
  const RABBIT = [
    '..ww....ww..',
    '..wp....pw..',
    '..wp....pw..',
    '..wp....pw..',
    '..ww....ww..',
    '.wwwwwwwwww.',
    'wwwwwwwwwwws',
    'wwewwwwwewws',
    'wbwwwnnwwbws',
    'wwwwwmmwwwws',
    'wwwwwwwwwwss',
    'wwwwwwwwwwss',
    'wwwwwwwwwsss',
    '.wwwwwwwsss.',
  ];
  const RABBIT_COLORS = { w: '#ffffff', s: '#d8dce8', p: '#ffb3c6', e: '#151515', b: '#ffb3c6', n: '#ff8fa3', m: '#c9573a' };
  const RABBIT_SVG = pix(RABBIT, RABBIT_COLORS, 6, '#1d2236');
  const KIND_SVG = { mole: MOLE_SVG, gold: GOLD_SVG, rabbit: RABBIT_SVG };
  // 게임기 토끼 귀: w 흰 털, p 귀 안쪽 분홍
  const EAR = ['.ww.', 'wppw', 'wppw', 'wppw', 'wppw', 'wppw', 'wppw', 'wppw', 'wppw', 'wppw', 'wwww', 'wwww', 'wwww', 'wwww'];
  document.querySelectorAll('[data-ear]').forEach(el => { el.innerHTML = pix(EAR, { w: '#ffffff', p: '#ffb3c6' }, 7, '#5b2340'); });
  // 범례 아이콘
  document.querySelector('[data-icon="mole"]').innerHTML = pix(MOLE, MOLE_COLORS, 2, '#1d2236');
  document.querySelector('[data-icon="gold"]').innerHTML = pix(MOLE, GOLD_COLORS, 2, '#5a3a00');
  document.querySelector('[data-icon="rabbit"]').innerHTML = pix(RABBIT, RABBIT_COLORS, 2, '#1d2236');
  const PIT_SVG = pix(PIT, PIT_COLORS, 6);
  const BURST_SVG = pix(BURST, BURST_COLORS, 6, '#1d2236');

  // ---------- 뿅망치 마우스 포인터 ----------
  // 똑바로 선 망치(손잡이 아래, 머리 위)를 deg만큼 기울여 14×14 도트로 찍는다.
  // r 빨간 머리, y 노란 끝, R 머리 그늘, w 나무 손잡이, W 손잡이 그늘
  function hammerMap(deg, pivot) {           // pivot: 손잡이 끝(회전 중심)
    const t = deg * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t), rows = [];
    for (let y = 0; y < 14; y++) {
      let row = '';
      for (let x = 0; x < 14; x++) {
        const dx = x + 0.5 - pivot[0], dy = y + 0.5 - pivot[1];
        const lx = dx * c + dy * sn, ly = -dx * sn + dy * c;   // 망치 기준 좌표로 되돌리기
        let ch = '.';
        if (ly >= -13 && ly < -8 && lx >= -4.5 && lx < 4.5) ch = (lx < -3 || lx >= 3) ? 'y' : ly >= -9 ? 'R' : 'r';
        else if (ly >= -8 && ly < 0.5 && lx >= -1 && lx < 1) ch = lx >= 0 ? 'W' : 'w';
        row += ch;
      }
      rows.push(row);
    }
    return rows;
  }
  const HAMMER_COLORS = { r: '#ff5a6e', R: '#d63a50', y: '#ffcf3f', w: '#e0a46e', W: '#b9773f' };
  // 망치 머리 가운데를 클릭 지점(핫스팟)으로 삼는다
  function hammerCursor(deg, pivot) {
    const t = deg * Math.PI / 180, lx = 0, ly = -10.5;
    const hx = pivot[0] + lx * Math.cos(t) - ly * Math.sin(t);
    const hy = pivot[1] + lx * Math.sin(t) + ly * Math.cos(t);
    const px = 6, o = 1;                     // 6배 확대 + 외곽선 1칸 → 96×96 (브라우저 커서 한도 128 이하)
    const sx = Math.round(hx + o) * px, sy = Math.round(hy + o) * px;   // 핫스팟(화면 픽셀), 도트 칸 경계에 맞춤
    const svg = pix(hammerMap(deg, pivot), HAMMER_COLORS, px, '#1d2236').replace('<svg ', "<svg xmlns='http://www.w3.org/2000/svg' ");
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${sx} ${sy}, pointer`;
  }
  const HAMMER_UP = [-40, [10.5, 12.5]], HAMMER_DOWN = [-75, [13, 9]];   // 들고 있을 때 / 내려칠 때 (머리가 칸 안에 들어오게 중심을 옮김)
  $('lawn').style.setProperty('--hammer', hammerCursor(...HAMMER_UP));
  $('lawn').style.setProperty('--hammer-swing', hammerCursor(...HAMMER_DOWN));
  // 누르는 순간 잠깐 내려친 모양

  // 도트 SVG를 CSS 배경 이미지 주소로 바꾼다 (배경 이미지로 쓰려면 xmlns가 꼭 있어야 그려진다)
  const svgURL = (map, pal, px, outline) =>
    `url("data:image/svg+xml,${encodeURIComponent(pix(map, pal, px, outline).replace('<svg ', "<svg xmlns='http://www.w3.org/2000/svg' "))}")`;
  $('lawn').style.backgroundImage = svgURL(grassTile(), GRASS_COLORS, 4);
  // 점수판 결 무늬: w 바탕, k 결
  const WOOD = [
    'wwwwwwwwwwwwwwww',
    'wwwwwkkkwwwwwwww',
    'wwwwwwwwwwwwwwww',
    'wwwwwwwwwwwkkkkw',
    'wwwwwwwwwwwwwwww',
    'kkwwwwwwwwwwwwww',
    'wwwwwwwwwwwwwwww',
    'wwwwwwwwkkkwwwww',
  ];
  document.querySelector('.screen').style.backgroundImage = svgURL(WOOD, { w: '#7a2e55', k: '#6c284b' }, 4);

  // ---------- 바깥 풍경 ----------
  // 언덕: 사인파 두 개를 더해 둥근 능선을 만들고, 타일 양 끝이 이어지도록 한 주기로 맞춘다. h 언덕, l 능선 밝은 줄, d 아래 그늘
  function hillTile(W, H, base, a, b, phase) {
    const top = Array.from({ length: W }, (_, x) =>
      Math.round(base + a * Math.sin(2 * Math.PI * x / W + phase) + b * Math.sin(4 * Math.PI * x / W + phase * 2)));
    return Array.from({ length: H }, (_, y) => top.map(t => y < t ? '.' : y === t ? 'l' : y > H - 3 ? 'd' : 'h').join(''));
  }
  // 울타리: p 기둥, q 기둥 그늘, r 가로대, s 가로대 그늘
  const FENCE = [
    '.pq.........',
    'ppqq........',
    'ppqq........',
    'ppqqrrrrrrrr',
    'ppqqssssssss',
    'ppqq........',
    'ppqqrrrrrrrr',
    'ppqqssssssss',
    'ppqq........',
    'ppqq........',
  ];
  const FENCE_COLORS = { p: '#d9965a', q: '#a8693a', r: '#d9965a', s: '#a8693a' };
  // 잔디 윗선: 풀잎이 삐죽삐죽 솟은 가장자리 (24×6)
  const GRASS_EDGE = [
    '..l.....l.....l.......l.',
    '.lgl...lgl...lgg.....lgl',
    'lgggl.lgggl.lgggl...lggg',
    'gggggggggggggggggglggggg',
    'gggggggggggggggggggggggg',
    'gggggggggggggggggggggggg',
  ];
  // 구름: w 흰색, s 아래 그늘
  const CLOUD = [
    '.......wwww.........',
    '....wwwwwwwww.......',
    '...wwwwwwwwwwwwww...',
    '.wwwwwwwwwwwwwwwwww.',
    'wwwwwwwwwwwwwwwwwwww',
    'wwwwwwwwwwwwwwwwwwww',
    '.sswwwwwwwwwwwwwwss.',
    '...ssssssssssssss...',
  ];
  const CLOUD_COLORS = { w: '#ffffff', s: '#d4ecfb' };

  (function buildScene() {
    const scene = $('scene');
    const layer = (cls, css) => { const el = document.createElement('div'); el.className = cls; Object.assign(el.style, css); scene.appendChild(el); return el; };
    [ // x, y, 크기(px), 흐르는 시간, 시작 지점
      [8, 6, 6, 120, -20], [62, 3, 5, 150, -95], [34, 15, 4, 100, -60], [84, 20, 3, 90, -10],
    ].forEach(([x, y, px, t, d]) => {
      const c = layer('cloud', {});
      c.style.cssText = `--x:${x}vw;--y:${y}vh;--t:${t}s;--d:${d}s;--steps:${t * 4}`;
      c.innerHTML = pix(CLOUD, CLOUD_COLORS, px);
    });
    layer('hills-far', { backgroundImage: svgURL(hillTile(56, 20, 7, 3, 2, 0.6), { h: '#a6dd8f', l: '#c4ebb0', d: '#94d07c' }, 6) });
    layer('hills-near', { backgroundImage: svgURL(hillTile(40, 16, 7, 3, 1.5, 2.1), { h: '#72c45c', l: '#8fd47a', d: '#62b54e' }, 6) });
    layer('fence', { backgroundImage: svgURL(FENCE, FENCE_COLORS, 5) });
    layer('ground', {
      backgroundImage: `${svgURL(GRASS_EDGE, GRASS_COLORS, 4)}, ${svgURL(grassTile(), GRASS_COLORS, 4)}`,
      backgroundSize: '96px 24px, 96px 96px',
      backgroundPosition: '0 0, 0 24px',
      backgroundRepeat: 'repeat-x, repeat',
    });
    // 빼꼼 친구들: 종류, 왼쪽/오른쪽, 가장자리에서 거리(%), 바닥에서 높이(px), 보이는 머리 높이(px), 숨는 타이밍
    const PEEKS = [
      // 두더지는 앞니(아래쪽)까지 보여야 두더지로 보이므로 머리 높이를 넉넉히 준다
      ['rabbit', 'left', 2, 34, 46, -0.4], ['mole', 'left', 11, 10, 50, -2.1], ['gold', 'left', 20, 46, 50, -3.3],
      ['mole', 'right', 3, 22, 50, -1.2], ['rabbit', 'right', 12, 50, 46, -2.8],
    ];
    const PEEK_ART = {
      mole: pix(MOLE, MOLE_COLORS, 4, '#1d2236'), gold: pix(MOLE, GOLD_COLORS, 4, '#5a3a00'), rabbit: pix(RABBIT, RABBIT_COLORS, 4, '#1d2236'),
    };
    const PEEK_PIT = pix(PIT, PIT_COLORS, 5);
    PEEKS.forEach(([kind, side, pos, bottom, h, d]) => {
      const el = layer('peek', { [side]: `${pos}%`, bottom: `${bottom}px` });
      el.innerHTML = `<span class="pb" style="height:${h}px"><span class="pc" style="--d:${d}s">${PEEK_ART[kind]}</span></span>${PEEK_PIT}`;
    });
  })();
  $('field').innerHTML = Array.from({ length: 9 }, (_, i) =>
    `<button type="button" class="hole" data-hole="${i}" aria-label="${i + 1}번 구멍">` +
    `<span class="burrow"><span class="mole">${MOLE_SVG}</span></span><span class="pit">${PIT_SVG}</span>` +
    `<span class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>` +
    `<span class="burst" aria-hidden="true">${BURST_SVG}</span><span class="sparkle" aria-hidden="true"><i></i><i></i><i></i></span></button>`).join('');
  $('timebar').innerHTML = '<i></i>'.repeat(30);

  // ---------- 두더지 등장 반복 ----------
  const UP_MS = 1000;                 // 올라와 있는 시간
  const DOWN_MS = 280;                // 들어가는 애니메이션 길이 (CSS dive와 맞춤)
  const HIT_MS = 220;                 // 잡혀서 사라지는 애니메이션 길이 (CSS whacked와 맞춤)
  const GAP_MIN = 350, GAP_MAX = 750; // 다음 두더지가 나오기 전 쉬는 시간
  const FAST_MS = 700;                // 이 시간 안에 잡으면 '빠른 잡기' (올라오기 시작한 순간부터, 사람 반응 속도에 맞춤)
  const holes = [...document.querySelectorAll('.hole')];
  let running = false, timer = null, last = -1;
  let cur = null;                     // 지금 나와 있는 두더지 { hole, upAt }
  // ---------- 콤보 가속: 빠른 잡기가 이어질수록 빨라지고, 깨지면 바로 원래 속도 ----------
  const TEMPO_MAX = 10;               // 콤보 10에서 더 빨라지지 않는다
  const tempo = () => Math.min(fast, TEMPO_MAX) / TEMPO_MAX;               // 0 ~ 1
  // 나와 있는 시간: 최대 20% 줄어든다 (보통 1초 → 0.8초, 황금 0.75초 → 0.6초). 사람 반응으로 잡을 수 있는 바닥
  const upTime = (kind) => (kind === 'gold' ? GOLD_UP_MS : UP_MS) * (1 - 0.2 * tempo());
  // 쉬는 시간: 최대 절반까지 줄어든다 (0.35~0.75초 → 0.18~0.38초). 템포가 확 빨라지는 쪽
  const gap = () => (GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN)) * (1 - 0.5 * tempo());

  // 나오는 친구: 황금 두더지 8%, 토끼 22%, 나머지는 보통 두더지. 판의 첫 번째는 항상 두더지
  const GOLD_RATE = 0.08, RABBIT_RATE = 0.22;
  const GOLD_UP_MS = 750;             // 황금 두더지는 더 빨리 숨는다
  let popCount = 0;
  function pickKind() {
    if (popCount++ === 0) return 'mole';
    const r = Math.random();
    return r < GOLD_RATE ? 'gold' : r < GOLD_RATE + RABBIT_RATE ? 'rabbit' : 'mole';
  }

  function popNext() {
    if (!running) return;
    let i;
    do { i = Math.floor(Math.random() * holes.length); } while (i === last);   // 같은 구멍 연속은 피한다
    last = i;
    const hole = holes[i];
    const kind = pickKind();
    hole.querySelector('.mole').innerHTML = KIND_SVG[kind];
    // 종류 표시는 is- 를 붙인다 (그냥 'mole'이면 두더지 그림의 .mole 스타일과 겹쳐 구멍이 사라짐)
    hole.classList.remove('down', 'hit', 'is-mole', 'is-gold', 'is-rabbit');
    hole.classList.add('up', `is-${kind}`);
    cur = { hole, kind, upAt: performance.now() };
    timer = setTimeout(escape, upTime(kind));
  }

  // 못 잡고 시간이 지나면 스스로 들어간다 → 두더지를 놓치면 콤보가 끊긴다 (토끼는 안 잡는 게 정답이라 그대로)
  function escape() {
    const hole = cur.hole;
    if (cur.kind !== 'rabbit') { breakCombo(hole); countClick(false); }   // 놓친 두더지·황금 두더지는 정확도에서 실패로 센다
    cur = null;
    hole.classList.replace('up', 'down');
    setTimeout(() => hole.classList.remove('down'), DOWN_MS);
    timer = setTimeout(popNext, DOWN_MS + gap());
  }

  // ---------- 점수 · 칭찬 · 콤보 ----------
  const PRAISES = ['Cool!', 'Nice!', 'Great!', 'Super!', 'Wow!'];
  let score = 0, fast = 0, lastPraise = -1;   // fast: 빠른 잡기 연속 수
  let clicks = 0, hits = 0;                   // 정확도 = 잡은 두더지 / (잡은 두더지 + 빈 구멍 클릭 + 토끼 잡기 + 놓친 두더지·황금 두더지)
  const accText = () => clicks ? `${Math.round(hits / clicks * 100)}%` : '-';
  function countClick(hit) {
    clicks++;
    if (hit) hits++;
    $('acc').textContent = accText();
  }
  let maxCombo = 0;                           // 이번 판 최대 콤보 (Combo 2부터 센다)

  function addScore(n) {
    score += n;
    $('score').textContent = score;
    const box = $('score').parentNode;
    box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  }

  // 구멍 위에 글자를 잠깐 띄운다 (글자는 모두 코드에 적힌 값만 쓴다)
  function floatText(hole, cls, lines) {
    const el = document.createElement('span');
    el.className = `float ${cls}`;
    el.setAttribute('aria-hidden', 'true');
    lines.forEach(([c, t]) => { const s = document.createElement('span'); if (c) s.className = c; s.textContent = t; el.appendChild(s); });
    hole.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function pickPraise() {
    let i;
    do { i = Math.floor(Math.random() * PRAISES.length); } while (i === lastPraise);   // 같은 칭찬 연속은 피한다
    lastPraise = i;
    return PRAISES[i];
  }

  // ---------- 콤보 말풍선 (한 번에 하나만) ----------
  let bubbleEl = null, bubbleTimer = null;
  function clearBubble() {
    clearTimeout(bubbleTimer);
    if (bubbleEl) bubbleEl.remove();
    bubbleEl = null;
  }
  function makeBubble(hole, n, cls, life) {
    clearBubble();
    const el = document.createElement('span');
    const side = Number(hole.dataset.hole) % 3 === 2 ? 'side-l' : 'side-r';   // 오른쪽 줄은 왼쪽에
    el.className = `cbubble ${side} ${cls}`;
    el.setAttribute('aria-hidden', 'true');
    ['l', 'r'].forEach(k => {
      const half = document.createElement('span');
      half.className = `half ${k}`;
      const num = document.createElement('b');

  // 속도 단계: 1(콤보 0~4) · 2(5~9) · 3(10 이상)
  const tempoEl = $('tempo');
  const tierOf = (n) => n >= 10 ? 3 : n >= 5 ? 2 : 1;
  let tier = 1;
  function rushLines(seed) {
    let r = seed;
    const rand = () => (r = (r * 9301 + 49297) % 233280) / 233280;   // 매번 같은 무늬가 나오는 간단한 난수
    let lines = '';
    for (let i = 0; i < 40; i++) {
      const a = (i / 40) * Math.PI * 2 + rand() * 0.12;
      const r1 = 62 + rand() * 22, r2 = r1 + 18 + rand() * 30;
      const w = rand() < 0.3 ? 2.5 : 1.4;
      lines += `<line x1="${(100 + Math.cos(a) * r1).toFixed(1)}" y1="${(100 + Math.sin(a) * r1).toFixed(1)}" x2="${(100 + Math.cos(a) * r2).toFixed(1)}" y2="${(100 + Math.sin(a) * r2).toFixed(1)}" stroke-width="${w}"/>`;
    }
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' preserveAspectRatio='none' stroke='#fff' stroke-linecap='square'>${lines}</svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  }
  document.querySelectorAll('.rush-lines').forEach((el, i) => { el.style.backgroundImage = rushLines(i ? 777 : 31); });

  function updateTempo() {
    const next = tierOf(fast);
    tempoEl.querySelectorAll('i').forEach((el, i) => el.classList.toggle('on', i < next));
    tempoEl.classList.toggle('t3', next === 3);
    if (next > tier && running) {               // 한 단계 올라갈 때만 크게 알린다
      const el = document.createElement('span');
      el.className = 'speedup';
      el.setAttribute('aria-hidden', 'true');
      el.textContent = next === 3 ? '최고 속도!' : '빨라진다!';
      $('lawn').appendChild(el);
      setTimeout(() => el.remove(), 950);
    }
    $('lawn').classList.toggle('rush-2', next === 2 && running);   // 가속 효과
    $('lawn').classList.toggle('rush-3', next === 3 && running);
    tier = next;
  }

  const bezel = document.querySelector('.bezel');
  function shake(t) {
    bezel.style.setProperty('--amp', t === 3 ? '6px' : '3px');
    bezel.classList.remove('shake');
    void bezel.offsetWidth;                       // 연달아 잡아도 처음부터 다시 흔들리게
    bezel.classList.add('shake');
  }

  // hole: 콤보가 깨진 자리(빈 구멍, 토끼, 느리게 잡은 구멍, 놓친 구멍). 그 옆에서 말풍선이 갈라진다
  function breakCombo(hole) {
    const lost = fast;
    fast = 0;
    updateTempo();                                // 깨지면 바로 원래 속도
    if (lost >= 2 && hole) makeBubble(hole, lost, 'break', 650);
  }

  // ---------- 히트박스: 동물 그림 + 오른쪽 위로 확장 ----------
  // 타격 별은 누른 자리보다 왼쪽 아래(구멍 폭의 18%·16%)에서 터진다. 그래서 플레이어는 별이 터진 곳을 '친 곳'으로 느끼고
  // 다음엔 그림 오른쪽 위를 누르기 쉽다. 그만큼 히트박스를 오른쪽 위로 늘려 둔다.
  const BURST_SHIFT = { x: 0.18, y: 0.16 };   // CSS .burst의 18cqw·16cqw와 같은 값
  const HIT_PAD = 0.06;                       // 그림 둘레 여유 (구멍 폭 기준)
  function inHitbox(hole, pt) {
    const w = hole.getBoundingClientRect().width;
    const m = hole.querySelector('.mole').getBoundingClientRect();     // 올라오는 중이면 움직이는 그대로의 위치
    const b = hole.querySelector('.burrow').getBoundingClientRect();   // 구멍 위로 보이는 부분만
    const top = Math.max(m.top, b.top), bottom = Math.min(m.bottom, b.bottom);
    if (bottom <= top) return false;                                   // 아직 안 보이면 못 맞힌다
    const pad = w * HIT_PAD;
    return pt.x >= m.left - pad && pt.x <= m.right + pad + w * BURST_SHIFT.x
        && pt.y >= top - pad - w * BURST_SHIFT.y && pt.y <= bottom + pad;
  }

  // hit: 나와 있는 동물을 맞혔는지 (부르는 쪽에서 판정)
  function whack(hole, pt, hit) {   // pt: 마우스·터치로 누른 화면 좌표 (키보드면 없음)
    if (!running) return;
    if (hit && cur && cur.hole === hole) {
      // 잡았다! 곧바로 cur를 비워서 같은 친구를 연타해도 점수는 한 번만 바뀐다
      const { kind } = cur;
      const quick = performance.now() - cur.upAt <= FAST_MS;
      cur = null;
      clearTimeout(timer);
      hole.classList.remove('up');
      if (pt) {
        const r = hole.getBoundingClientRect();
        hole.style.setProperty('--bx', `${pt.x - r.left}px`);
        hole.style.setProperty('--by', `${pt.y - r.top}px`);
      } else {
        hole.style.removeProperty('--bx');
        hole.style.removeProperty('--by');
      }
      hole.classList.add('hit');
      setTimeout(() => hole.classList.remove('hit'), HIT_MS + 100);
      const next = () => { timer = setTimeout(popNext, HIT_MS + gap()); };   // 점수·콤보 처리 뒤 바뀐 속도로 예약

      if (kind === 'rabbit') {
        // 토끼를 잡으면 -5점(0점 아래로는 안 내려감) + 콤보 깨짐. 정확도에서는 빗나간 클릭
        countClick(false);
        breakCombo(hole);
        addScore(-Math.min(5, score));
        floatText(hole, 'bad', [['warn', '토끼는 안 돼!'], ['pts', '-5']]);
        next();
        return;
      }

      countClick(true);
      const base = kind === 'gold' ? 5 : 1;
      if (quick) {
        fast++;
        updateTempo();
        const gain = base + fast;                 // 보통: 첫 빠른 잡기 2점, 콤보 n이면 1+n점 / 황금: 5+n점
        addScore(gain);
        floatText(hole, kind === 'gold' ? 'quick gold' : 'quick',
          [['praise', kind === 'gold' ? '황금!' : pickPraise()], ['pts', `+${gain}`]]);
        if (fast >= 2) { showCombo(fast, hole); maxCombo = Math.max(maxCombo, fast); }
        if (tier >= 2) shake(tier);
      } else {
        breakCombo(hole);
        addScore(base);
        floatText(hole, 'slow', [['late', '느려요'], ['pts', `+${base}`]]);   // 콤보가 왜 깨졌는지 알 수 있게
      }
      next();
      return;
    }
    // 들어가는 중이거나 방금 잡힌 구멍은 눌러도 무시
    if (hole.classList.contains('down') || hole.classList.contains('hit')) return;
    // 빈 구멍(또는 동물이 있는 칸이지만 히트박스 밖): 문구 띄우고 콤보 깨짐
    floatText(hole, 'empty', [['', cur && cur.hole === hole ? '빗나감~' : '텅~']]);
    countClick(false);
    breakCombo(hole);
  }

  // 마우스·터치: 잔디밭 어디를 눌러도 먼저 나와 있는 동물의 히트박스(칸 밖으로 넘친 부분 포함)를 확인하고,
  // 아니면 누른 칸을 빈 구멍으로 처리한다. 칸 사이 잔디를 누르면 아무 일도 없다.
  $('lawn').addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const pt = { x: e.clientX, y: e.clientY };
    if (cur && inHitbox(cur.hole, pt)) return whack(cur.hole, pt, true);
    const hole = e.target.closest('.hole');
    if (hole) whack(hole, pt, false);
  });
  // 키보드(Enter/Space)로 구멍을 누르면 그 칸에 동물이 있으면 맞힌 것으로
  holes.forEach(hole => hole.addEventListener('click', (e) => {
    if (e.detail === 0) whack(hole, null, !!cur && cur.hole === hole);
  }));

  // ---------- 30초 제한시간 ----------
  const GAME_SEC = 30;
  const timeCells = [...$('timebar').children];
  let timeLeft = GAME_SEC, clock = null;

  function drawTime() {
    $('time').textContent = timeLeft;
    // 지난 시간만큼 오른쪽 칸부터 비운다
    timeCells.forEach((c, i) => c.classList.toggle('gone', i >= timeLeft));
    const low = timeLeft <= 5;
    $('timebar').classList.toggle('low', low);
    $('timeBox').classList.toggle('low', low);
  }

  function tick() {
    timeLeft--;
    drawTime();
    if (timeLeft <= 0) endGame();
  }

  function endGame() {
    running = false;                              // 이제 클릭해도 whack()이 아무것도 안 한다
    $('lawn').classList.remove('playing', 'swing', 'rush-2', 'rush-3');   // 포인터·가속 효과도 원래대로
    clearInterval(clock);
    clearTimeout(timer);                          // 다음 두더지 예약 취소
    clearBubble();
    if (cur) {                                    // 나와 있던 두더지는 쏙 들어간다
      const hole = cur.hole;
      cur = null;
      hole.classList.replace('up', 'down');
      setTimeout(() => hole.classList.remove('down'), DOWN_MS);
    }
    const best = store.get('mole-best');
    const record = score > best;
    if (record) { store.set('mole-best', score); $('best').textContent = score; }

    $('finalScore').textContent = score;
    $('maxCombo').textContent = maxCombo;
    $('finalAcc').textContent = accText();
    $('finalAccDetail').textContent = clicks ? `(기회 ${clicks}번 중 ${hits}번 성공)` : '(기록 없음)';
    const line = $('endLine');
    line.className = `endline${record ? ' record' : ''}`;
    line.textContent = record ? '신기록이에요!' : `최고 기록 ${best}점`;

    // 두더지가 들어가는 걸 잠깐 보여 준 뒤 결과판을 띄운다
    setTimeout(() => {
      $('endPanel').hidden = false;
      $('againBtn').focus();
    }, DOWN_MS + 120);
  }

  function startGame() {
    clearTimeout(timer);
    clearBubble();
    clearInterval(clock);
    holes.forEach(h => { h.classList.remove('up', 'down', 'hit'); h.querySelectorAll('.float').forEach(f => f.remove()); });
    $('startPanel').hidden = true;
    $('endPanel').hidden = true;
    score = 0; fast = 0; maxCombo = 0; cur = null;
    clicks = 0; hits = 0; popCount = 0;
    tier = 1; updateTempo();
    $('acc').textContent = accText();
    $('score').textContent = 0;
    timeLeft = GAME_SEC;
    drawTime();
    running = true;
    $('lawn').classList.add('playing');   // 포인터를 뿅망치로
    last = -1;
    timer = setTimeout(popNext, 400);
    clock = setInterval(tick, 1000);
  }
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
</script>
</body>
</html>
